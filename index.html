<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>♪</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif}
    body{
      min-height:100vh;display:grid;place-items:center;overflow:hidden;
      background:linear-gradient(145deg,#fff7fb,#f4f0ff 52%,#eef7ff);
    }
    .scene{
      width:min(92vw,560px);height:min(88vh,620px);min-height:420px;
      border-radius:32px;position:relative;overflow:hidden;
      display:grid;place-items:center;
      background:linear-gradient(145deg,#fff7fb,#f4f0ff 52%,#eef7ff);
      border:1px solid rgba(0,0,0,.08);
    }
    .glow{
      position:absolute;width:260px;height:260px;border-radius:50%;
      background:rgba(255,255,255,.82);filter:blur(10px);
      box-shadow:0 0 80px rgba(150,130,190,.18);
    }
    .orb{position:absolute;border-radius:50%;opacity:.38;animation:float 5s ease-in-out infinite}
    .one{width:78px;height:78px;left:10%;top:17%;background:#ffd8e8}
    .two{width:52px;height:52px;right:14%;top:24%;background:#dcd1ff;animation-delay:-2s}
    .three{width:60px;height:60px;left:18%;bottom:14%;background:#cfeeff;animation-delay:-3.5s}
    .four{width:42px;height:42px;right:18%;bottom:17%;background:#ffe4c7;animation-delay:-1s}
    button{
      position:relative;width:112px;height:112px;border-radius:50%;
      border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.86);
      box-shadow:0 14px 38px rgba(0,0,0,.14);cursor:pointer;
      display:grid;place-items:center;transition:transform .2s,box-shadow .2s;
      -webkit-tap-highlight-color:transparent;
    }
    button:hover{transform:scale(1.06);box-shadow:0 18px 45px rgba(0,0,0,.17)}
    button:focus-visible{outline:3px solid rgba(100,80,160,.45);outline-offset:6px}
    .play{margin-left:8px;width:0;height:0;border-top:18px solid transparent;
      border-bottom:18px solid transparent;border-left:27px solid #333}
    .pause{display:none;width:24px;height:32px;border-left:7px solid #333;border-right:7px solid #333}
    .playing .play{display:none}.playing .pause{display:block}
    iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
    @keyframes float{50%{transform:translateY(-13px)}}
    @media(prefers-reduced-motion:reduce){.orb{animation:none}}
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="glow"></div>
    <div class="orb one"></div><div class="orb two"></div>
    <div class="orb three"></div><div class="orb four"></div>
    <button id="play" type="button" aria-label="Play song">
      <span class="play"></span><span class="pause"></span>
    </button>
  </main>
  <script>
    const scene=document.getElementById("scene");
    const button=document.getElementById("play");
    let player=null;
    button.addEventListener("click",()=>{
      if(!player){
        player=document.createElement("iframe");
        player.src="https://audio.com/embed/v2/audio/1877710985709689?theme=light&layout=fixed&cover=false&footer=false&author=false&watermark=false&autoplay=true";
        player.allow="autoplay";
        scene.appendChild(player);
        scene.classList.add("playing");
      }
    });
  </script>
</body>
</html>
