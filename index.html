<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♪</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.8),transparent 30%),radial-gradient(circle at 80% 75%,rgba(255,255,255,.55),transparent 28%),linear-gradient(135deg,#eef4ff,#f8efff);font-family:system-ui,sans-serif}
.orb{position:fixed;border-radius:50%;background:rgba(255,255,255,.9);opacity:.55}
.o1{width:130px;height:130px;top:8%;left:8%}.o2{width:90px;height:90px;bottom:12%;right:10%}.o3{width:55px;height:55px;top:22%;right:18%}
.button{width:150px;height:150px;border:0;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 18px 45px rgba(70,60,100,.18);cursor:pointer;position:relative}
.button:active{transform:scale(.94)}
.button:after{content:"";position:absolute;left:60px;top:45px;width:0;height:0;border-top:30px solid transparent;border-bottom:30px solid transparent;border-left:42px solid #333}
.player{width:min(92vw,520px);border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(70,60,100,.18);background:white}
iframe{display:block;width:100%;height:140px;border:0}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<button class="button" aria-label="Play" onclick="startSong()"></button>
<script>
function startSong(){
 const button=document.querySelector('.button'); button.remove();
 const player=document.createElement('div'); player.className='player';
 const iframe=document.createElement('iframe');
 iframe.src='https://audio.com/embed/v2/audio/1877710985709689?autoplay=1&theme=light&layout=fixed&cover=false&footer=false&author=false&watermark=false';
 iframe.allow='autoplay; fullscreen';
 iframe.setAttribute('allowfullscreen','');
 iframe.title='Audio player';
 player.appendChild(iframe); document.body.appendChild(player);
}
</script>
</body>
</html>
